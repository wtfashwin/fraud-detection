# API and worker always use the same artifact. Select an explicitly built tag.
image:
  repository: ghcr.io/wtfashwin/fraud-api
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
modelDir: /app/models
api:
  # A single migration owner is the baseline; entrypoint runs Alembic before API.
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
worker:
  replicaCount: 1
  concurrency: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    # Requires an installed KEDA operator and ScaledObject CRD.
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    queueLength: "5"
redis:
  architecture: standalone
  auth:
    enabled: false
  sentinel:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi
postgresql:
  auth:
    username: fraud
    # Supply your own password via a private values file; never commit it.
    password: ""
    database: fraud
  primary:
    persistence:
      enabled: true
      size: 1Gi
mlflowEnabled: false
mlflow:
  # Optional tracking server only; this chart does not publish/register a model.
  # Configure durable backend/artifact storage before relying on its history.
  backendStore:
    databaseMigration: false
    databaseConnectionCheck: false
    postgres:
      enabled: false
monitoring:
  # Adds Prometheus scrape annotations; no collector/dashboard is installed.
  enabled: true
otel:
  # An externally supplied collector is required when enabled.
  enabled: false
  endpoint: ""

# Optional shared-secret demo gate. The Secret is created outside this chart.
demoAuth:
  mode: "off"
  existingSecret: ""
