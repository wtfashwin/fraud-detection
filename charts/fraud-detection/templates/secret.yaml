apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fraud-detection.fullname" . }}-db
  labels:
    {{- include "fraud-detection.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s:5432/%s" (.Values.postgresql.auth.username | urlquery | replace "+" "%20") (required "Set postgresql.auth.password in a private values file" .Values.postgresql.auth.password | urlquery | replace "+" "%20") (include "postgresql.v1.primary.fullname" .Subcharts.postgresql) (.Values.postgresql.auth.database | urlquery | replace "+" "%20") | quote }}
