{{- if not (has .Values.demoAuth.mode (list "off" "basic")) -}}
{{- fail "demoAuth.mode must be off or basic" -}}
{{- end -}}
{{- if eq .Values.demoAuth.mode "basic" -}}
{{- $_ := required "demoAuth.existingSecret is required in basic mode" .Values.demoAuth.existingSecret -}}
{{- if .Values.monitoring.enabled -}}
{{- fail "demoAuth basic mode requires monitoring.enabled=false; configure authenticated scraping separately" -}}
{{- end -}}
{{- else if .Values.demoAuth.existingSecret -}}
{{- fail "demoAuth.existingSecret requires basic mode" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fraud-detection.fullname" . }}-api
  labels:
    {{- include "fraud-detection.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.api.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      {{- include "fraud-detection.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "fraud-detection.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/database: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.monitoring.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-for-database
        image: {{ include "fraud-detection.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: [python, -c]
        args:
        - |
          import os, time
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"], connect_args={"connect_timeout": 3})
          for attempt in range(60):
              try:
                  with engine.connect() as connection:
                      connection.execute(text("SELECT 1"))
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(2)
        env:
          {{- include "fraud-detection.environment" . | nindent 10 }}
      containers:
      - name: api
        image: {{ include "fraud-detection.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
        env:
          {{- include "fraud-detection.environment" . | nindent 10 }}
          - name: DEMO_AUTH_MODE
            value: {{ .Values.demoAuth.mode | quote }}
          {{- if eq .Values.demoAuth.mode "basic" }}
          - name: DEMO_AUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.demoAuth.existingSecret | quote }}
                key: username
          - name: DEMO_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.demoAuth.existingSecret | quote }}
                key: password
          {{- end }}
          - name: RUN_MIGRATIONS
            value: "1"
          - name: OTEL_SERVICE_NAME
            value: fraud-api
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        startupProbe:
          httpGet:
            path: {{ if eq .Values.demoAuth.mode "basic" }}/status{{ else }}/health{{ end }}
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          {{- if eq .Values.demoAuth.mode "basic" }}
          exec:
            command: [python, -m, api.probe]
          {{- else }}
          httpGet:
            path: /ready
            port: http
          {{- end }}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: {{ if eq .Values.demoAuth.mode "basic" }}/status{{ else }}/health{{ end }}
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
