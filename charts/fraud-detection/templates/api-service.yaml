apiVersion: v1
kind: Service
metadata:
  name: {{ include "fraud-detection.fullname" . }}-api
  labels:
    {{- include "fraud-detection.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
  - name: http
    port: {{ .Values.api.service.port }}
    targetPort: http
  selector:
    {{- include "fraud-detection.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
