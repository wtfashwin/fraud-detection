name: fraud-detection
x-app: &app
  image: ${FRAUD_IMAGE:-fraud-api:local}
  build:
    context: .
  environment: &app-env
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    CELERY_BROKER_URL: redis://redis:6379/0
    MODEL_DIR: /app/models
  restart: unless-stopped
  init: true
  networks: [internal]
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    <<: *app
    environment:
      <<: *app-env
      DEMO_AUTH_MODE: ${DEMO_AUTH_MODE-off}
      DEMO_AUTH_USERNAME: ${DEMO_AUTH_USERNAME-}
      DEMO_AUTH_PASSWORD: ${DEMO_AUTH_PASSWORD-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    healthcheck:
      test: [CMD, python, -m, api.probe]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
  xai-worker:
    <<: *app
    command: [celery, -A, api.worker.app, worker, --loglevel=info, --concurrency=1]
    # Allow the Celery prefork worker to finish its warm shutdown.
    stop_grace_period: 30s
    environment:
      <<: *app-env
      RUN_MIGRATIONS: '0'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'celery -A api.worker.app inspect ping --destination "celery@$$HOSTNAME" --timeout 3 | python -c "import sys; sys.exit(0 if ''pong'' in sys.stdin.read() else 1)"']
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 20s
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    ports: ['127.0.0.1:9090:9090']
    networks: [internal]
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-demo-change-me}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3000:3000']
    networks: [internal]
volumes:
  postgres_data:
  redis_data:
networks:
  internal:
    driver: bridge
