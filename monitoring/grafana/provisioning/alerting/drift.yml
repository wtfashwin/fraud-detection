apiVersion: 1
groups:
  - orgId: 1
    name: fraud-input-distribution
    folder: Fraud monitoring
    interval: 30s
    rules:
      - uid: fraud-input-distribution-drift
        title: Raw fraud input distribution shifted
        condition: B
        data:
          - refId: A
            datasourceUid: fraud-prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: fraud-prometheus
              expr: max by (feature) (fraud_drift_ks)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 30s
        annotations:
          summary: Raw input KS statistic exceeded 0.05 for 30 seconds
          description: Input distribution shift requires investigation. Labels are required to establish an AUC decrease.
          runbook_url: https://github.com/wtfashwin/fraud-detection/blob/main/docs/runbooks/PredictionDrift.md
        labels:
          severity: warning
          service: fraud-api
        isPaused: false
