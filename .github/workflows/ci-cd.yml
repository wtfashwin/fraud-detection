name: Test and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fraud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Synthetic training smoke (not a quality gate)
        run: |
          python scripts/generate_synthetic_data.py
          python train_model.py
        env:
          CI_SYNTHETIC_SAMPLES: '500'
          DATA_CSV: data/creditcard.csv
          MODEL_OUTPUT_DIR: models/trained
          MLFLOW_TRACKING_URI: file:./mlruns
          MLFLOW_EXPERIMENT: synthetic-smoke
          MLFLOW_REGISTER_MODEL: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-training-smoke-only
          path: models/trained/
          if-no-files-found: error
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - run: pip install PyYAML==6.0.3
      - run: python charts/fraud-detection/tests/check_render.py --helm helm
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test fraud-frontend/tests/*.test.*
  container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated core stack
        run: docker compose --env-file .env.example up --build -d --wait --wait-timeout 120
      - name: Prediction and asynchronous explanation smoke
        run: python3 scripts/smoke_test.py --url http://127.0.0.1:8000
      - name: Build optional CPU training image
        run: docker build --target training -t fraud-training:ci .
      - name: Check optional training image dependencies
        run: >-
          docker run --rm --entrypoint python fraud-training:ci
          -c "import mlflow, shap, xgboost; from api.inference import load_bundle; assert load_bundle().score([0.0] * 30)[0] in (0, 1); print(xgboost.__version__)"
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --tail 100
      - name: Stop services
        if: always()
        run: docker compose --env-file .env.example down -v
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, frontend, chart, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fraud-api
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
