name: Test and package
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fraud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fraud_test
          POSTGRES_PASSWORD: fraud_test
          POSTGRES_DB: fraud_worker_tests
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U fraud_test -d fraud_worker_tests"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: pip install -r requirements.txt
      - name: Python tests including PostgreSQL worker concurrency
        run: python -m pytest -q
        env:
          FRAUD_TEST_DATABASE_URL: postgresql+psycopg2://fraud_test:fraud_test@127.0.0.1:5432/fraud_worker_tests
      - name: Synthetic training smoke (not a quality gate)
        run: |
          python scripts/generate_synthetic_data.py
          python -m training.train
        env:
          CI_SYNTHETIC_SAMPLES: '500'
          DATA_CSV: data/creditcard.csv
          MODEL_OUTPUT_DIR: models/trained
          MLFLOW_TRACKING_URI: file:./mlruns
          MLFLOW_EXPERIMENT: synthetic-smoke
          MLFLOW_REGISTER_MODEL: '1'
          MLFLOW_REGISTRATION_MODE: smoke
          MLFLOW_MODEL_NAME: ci-smoke-fraud-api
      - name: Verify throwaway smoke registry entry
        run: |
          python - <<'PY'
          from mlflow.tracking import MlflowClient
          versions = MlflowClient(tracking_uri="file:./mlruns").search_model_versions("name='ci-smoke-fraud-api'")
          assert len(versions) == 1
          assert versions[0].tags['registration_mode'] == 'smoke'
          assert versions[0].tags['production_approved'] == 'false'
          assert versions[0].tags['validation_scope'] == 'synthetic-smoke-only'
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-training-smoke-only
          path: models/trained/
          if-no-files-found: error
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.19.0
      - run: pip install PyYAML==6.0.3
      - run: python charts/fraud-detection/tests/check_render.py --helm helm
      - name: Validate drift alert rules
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "$PWD/monitoring:/work:ro" prom/prometheus:v2.54.1
          test rules /work/tests/drift_rules.test.yml
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --test web/tests/*.test.*
  container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and start isolated core stack
        run: docker compose --env-file .env.example up --build -d --wait --wait-timeout 120
      - name: Prediction and asynchronous explanation smoke
        run: >-
          python3 scripts/smoke_test.py --url http://127.0.0.1:8000
          --features-csv tests/fixtures/synthetic_transaction.csv
          --output reports/runtime/http-smoke.json
      - name: Save actual HTTP prediction and explanation responses
        uses: actions/upload-artifact@v7.0.2
        with:
          name: http-smoke-${{ matrix.runner }}
          path: reports/runtime/http-smoke.json
          if-no-files-found: error
      # Auth integration has a different project, network, volumes and port.
      - name: Authenticated demo and queued explanation
        env:
          AUTH_COMPOSE_PROJECT: fraud-auth-${{ github.run_id }}-${{ github.run_attempt }}
          API_PORT: '18001'
          DEMO_AUTH_MODE: basic
          COMPOSE_PROFILES: ''
          FRAUD_IMAGE: fraud-api:local
        run: |
          set +x
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if [[ ! "$AUTH_COMPOSE_PROJECT" =~ ^fraud-auth-[0-9]+-[0-9]+$ ]]; then
            echo 'Refusing an unsafe authenticated test project name'
            exit 1
          fi
          auth_compose=(docker compose --env-file .env.example --file docker-compose.yml --project-name "$AUTH_COMPOSE_PROJECT")
          existing="$("${auth_compose[@]}" ps --all --quiet 2>/dev/null)"
          if [ -n "$existing" ]; then
            echo 'Refusing an occupied authenticated test project'
            exit 1
          fi
          DEMO_AUTH_USERNAME="$(python3 -c 'import secrets; print("ci" + secrets.token_hex(8))')"
          DEMO_AUTH_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export DEMO_AUTH_USERNAME DEMO_AUTH_PASSWORD
          cleanup_auth_stack() {
            "${auth_compose[@]}" down --volumes --timeout 30 >/dev/null 2>&1
          }
          trap cleanup_auth_stack EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if ! "${auth_compose[@]}" up --no-build -d --wait --wait-timeout 120 api xai-worker >/dev/null 2>&1; then
            echo 'Authenticated test stack did not become healthy'
            exit 1
          fi
          python3 scripts/smoke_demo_auth.py --url http://127.0.0.1:18001 \
            --features-csv tests/fixtures/synthetic_transaction.csv \
            --output reports/runtime/auth-http-smoke.json
      - name: Save authenticated synthetic HTTP responses
        uses: actions/upload-artifact@v7.0.2
        with:
          name: authenticated-http-smoke-${{ matrix.runner }}
          path: reports/runtime/auth-http-smoke.json
          if-no-files-found: error
      - name: Build optional CPU training image
        run: docker build --target training -t fraud-training:ci .
      - name: Check optional training image dependencies
        run: >-
          docker run --rm -e RUN_MIGRATIONS=0 fraud-training:ci python
          -c "import mlflow, shap, xgboost; from api.inference import load_bundle; assert load_bundle().score([0.0] * 30)[0] in (0, 1); print(xgboost.__version__)"
      - name: Train isolated synthetic bundle in the optional image
        run: |
          docker run --name fraud-ci-training --entrypoint sh \
            -e CI_SYNTHETIC_SAMPLES=500 -e MLFLOW_TRACKING_URI= \
            -e MLFLOW_REGISTER_MODEL=0 fraud-training:ci \
            -ec 'python scripts/generate_synthetic_data.py; python -m training.train'
          docker cp fraud-ci-training:/app/models/trained reports/runtime/trained
          docker rm fraud-ci-training
      - name: Set an ephemeral local Grafana credential
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python3 - <<'PY'
          import os, secrets
          credential = secrets.token_urlsafe(24)
          print('::add-mask::' + credential)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('GRAFANA_ADMIN_PASSWORD=' + credential + '\n')
          PY
      - name: Start synthetic model and local monitoring integration
        if: matrix.runner == 'ubuntu-24.04'
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml
          -f tests/fixtures/monitoring.compose.yml --profile monitoring
          up -d --no-build --wait --wait-timeout 120
      - name: Verify shared Redis drift metrics and Grafana alert firing
        if: matrix.runner == 'ubuntu-24.04'
        run: >-
          python3 scripts/smoke_drift.py --url http://127.0.0.1:8000
          --grafana-url http://127.0.0.1:3000 --timeout 120
          --output reports/runtime/drift-smoke.json
      - name: Save actual drift and alert evaluation results
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: drift-monitoring-smoke
          path: reports/runtime/drift-smoke.json
          if-no-files-found: error
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env.example --profile monitoring logs --tail 100
      - name: Stop services
        if: always()
        run: docker compose --env-file .env.example --profile monitoring down -v
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, frontend, chart, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fraud-api
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
